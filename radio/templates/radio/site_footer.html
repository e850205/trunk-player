{# Now-playing bar, trunkplayer.js shows it on pages that can play calls #}
<div class="deck" id="deck" role="region" aria-label="Now playing" hidden>
  <button type="button" class="big-play" id="deck-play" aria-label="Play">
    <svg width="22" height="22" aria-hidden="true"><use href="#i-play"/></svg>
  </button>
  <div class="lcd" aria-live="polite">
    <div class="lcd-tag" id="lcd-tag">Scanner idle</div>
    <div class="lcd-side"><b id="lcd-dec"></b></div>
    <div class="lcd-desc" id="lcd-desc">Press play on a call, or turn on auto-play</div>
    <div class="lcd-side" id="lcd-freq"></div>
  </div>
  <div class="scrub">
    <div class="progress" id="deck-progress" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-fill" id="deck-progress-fill"></div>
    </div>
    <div class="times"><span id="jp1_c_time">0:00</span><span id="jp1_duration">0:00</span></div>
  </div>
  <button type="button" class="switch scanner-switch" role="switch" aria-checked="false">
    <span class="track"></span><span class="switch-text">Auto-play new calls</span>
  </button>
</div>
