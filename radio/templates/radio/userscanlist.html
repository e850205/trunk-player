{% extends "radio/site_base.html" %}
{% block head %}
{{ form.media.css }}
{% endblock %}
{% block main-body %}
<div class="page-head">
  <div>
    <div class="label">Scan lists</div>
    <h1 class="page-title">New scan list</h1>
    <p>Save a set of talkgroups to listen to together.</p>
  </div>
</div>
<div class="card">
  <form method="POST">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <table class="form-table">
    {{ form.as_table }}
    </table>
    <div class="form-actions">
      <input type="submit" value="Create scan list">
      <a class="btn" href="{% url 'user_profile' %}">Cancel</a>
    </div>
  </form>
</div>
{{ form.media.js }}
{% endblock %}
